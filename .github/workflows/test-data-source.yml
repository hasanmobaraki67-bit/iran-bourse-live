 - main
paths:
- 'data_source_test.py'
- '.github/workflows/test-data-source.yml'


permissions:
contents: read


jobs:
test-data-source:
runs-on: ubuntu-latest
timeout-minutes: 3


steps:
  - name: Check out repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.x'

  - name: Test TSETMC data sources
    run: python data_source_test.py


